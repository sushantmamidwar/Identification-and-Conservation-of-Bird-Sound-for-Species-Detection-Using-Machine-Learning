<!DOCTYPE html>
<html>

<head>
    <title>Login — Bird Detection System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css"
        integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP" crossorigin="anonymous">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --emerald: #2ecc8f;
            --emerald-dark: #1a9e6a;
            --gold: #f0c060;
            --deep: #050d0a;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.14);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background: var(--deep);
            overflow-x: hidden;
        }

        /* ══ BACKGROUND SLIDESHOW ══ */
        .bg-slide {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .bg-slide .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            filter: brightness(0.22) saturate(1.6);
            animation: zoomSlow 22s ease-in-out infinite alternate;
        }

        .bg-slide .slide.active {
            opacity: 1;
        }

        @keyframes zoomSlow {
            from {
                transform: scale(1.0);
            }

            to {
                transform: scale(1.1);
            }
        }

        .bg-slide::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse 90% 80% at 50% 50%, rgba(2, 40, 20, 0.55) 0%, transparent 70%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
        }

        /* ══ PARTICLES ══ */
        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* ══ SLIDE DOTS ══ */
        .slide-dots {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
        }

        .sdot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            transition: all 0.4s ease;
        }

        .sdot.active {
            background: var(--emerald);
            transform: scale(1.5);
            box-shadow: 0 0 8px var(--emerald);
        }

        /* ══ BOOTSTRAP CONTAINER (keep original structure) ══ */
        .container {
            position: relative;
            z-index: 10;
        }

        /* ══ CARD ══ */
        .user_card {
            width: 420px;
            margin-top: auto;
            margin-bottom: auto;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 44px 38px 36px;
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            animation: riseUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        /* top glow line */
        .user_card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 143, 0.7), rgba(240, 192, 96, 0.4), transparent);
        }

        @keyframes riseUp {
            from {
                transform: translateY(55px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ══ BRAND ══ */
        .brand-icon {
            font-size: 2.8rem;
            display: block;
            text-align: center;
            margin-bottom: 8px;
            animation: floatIcon 3.5s ease-in-out infinite;
            filter: drop-shadow(0 0 18px rgba(46, 204, 143, 0.55));
        }

        @keyframes floatIcon {

            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-9px) rotate(3deg);
            }
        }

        #form-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #fff 20%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .brand-sub {
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.28);
            margin-bottom: 6px;
        }

        .brand-line {
            width: 0;
            height: 2px;
            margin: 10px auto 28px;
            background: linear-gradient(90deg, transparent, var(--emerald), transparent);
            border-radius: 2px;
            animation: expandLine 1.4s ease 0.4s forwards;
        }

        @keyframes expandLine {
            to {
                width: 80px;
            }
        }

        /* ══ INPUTS ══ */
        .form_container {
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 18px !important;
        }

        .input-group-text {
            background: rgba(46, 204, 143, 0.14) !important;
            color: var(--emerald) !important;
            border: 1px solid rgba(46, 204, 143, 0.22) !important;
            border-right: none !important;
            border-radius: 12px 0 0 12px !important;
            padding: 0 16px !important;
            font-size: 0.95rem;
            transition: background 0.3s ease;
        }

        .input-group:focus-within .input-group-text {
            background: rgba(46, 204, 143, 0.25) !important;
            border-color: var(--emerald) !important;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.28) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-left: none !important;
            border-radius: 0 12px 12px 0 !important;
            color: #fff !important;
            font-family: 'Outfit', sans-serif;
            font-size: 0.92rem !important;
            padding: 12px 44px 12px 16px !important;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s !important;
            height: auto !important;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.2) !important;
        }

        .form-control:focus {
            background: rgba(0, 0, 0, 0.4) !important;
            border-color: var(--emerald) !important;
            box-shadow: 0 0 0 3px rgba(46, 204, 143, 0.12) !important;
            outline: none !important;
        }

        /* password wrapper for eye toggle */
        .pw-wrap {
            position: relative;
            flex: 1 1 auto;
        }

        .pw-wrap .form-control {
            width: 100%;
            border-radius: 0 12px 12px 0 !important;
        }

        .pw-eye {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 0.88rem;
            padding: 0;
            transition: color 0.25s ease;
            z-index: 5;
        }

        .pw-eye:hover {
            color: var(--gold);
        }

        /* ══ REMEMBER + FORGOT ══ */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            margin-top: 4px;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.38);
            user-select: none;
        }

        .remember-label input[type="checkbox"] {
            display: none;
        }

        .chk-custom {
            width: 17px;
            height: 17px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(0, 0, 0, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            transition: all 0.25s ease;
        }

        .remember-label input:checked~.chk-custom {
            background: var(--emerald);
            border-color: var(--emerald);
            box-shadow: 0 0 10px rgba(46, 204, 143, 0.4);
        }

        .remember-label input:checked~.chk-custom::after {
            content: '✓';
            color: #fff;
        }

        .forgot-link {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.32);
            text-decoration: none;
            transition: color 0.25s ease;
        }

        .forgot-link:hover {
            color: var(--gold);
        }

        /* ══ LOGIN BUTTON ══ */
        .login_btn {
            width: 100% !important;
            padding: 14px 24px !important;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-dark)) !important;
            color: #fff !important;
            border: none !important;
            border-radius: 13px !important;
            font-family: 'Outfit', sans-serif !important;
            font-size: 1rem !important;
            font-weight: 600 !important;
            letter-spacing: 0.04em !important;
            cursor: pointer;
            box-shadow: 0 6px 26px rgba(46, 204, 143, 0.38) !important;
            transition: transform 0.25s ease, box-shadow 0.25s ease !important;
            position: relative;
            overflow: hidden;
        }

        .login_btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            transition: left 0.5s ease;
        }

        .login_btn:hover::before {
            left: 100%;
        }

        .login_btn:hover {
            transform: translateY(-3px) scale(1.01) !important;
            box-shadow: 0 14px 40px rgba(46, 204, 143, 0.52) !important;
        }

        .login_btn:focus {
            box-shadow: 0 0 0 3px rgba(46, 204, 143, 0.3) !important;
            outline: none !important;
        }

        .login_btn:active {
            transform: scale(0.98) !important;
        }

        /* ══ DJANGO MESSAGES ══ */
        #messages {
            background: rgba(231, 76, 60, 0.13);
            border: 1px solid rgba(231, 76, 60, 0.28);
            border-radius: 12px;
            color: #ff8a80;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 0.83rem;
            line-height: 1.6;
        }

        /* ══ DIVIDER ══ */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 16px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.09);
        }

        .divider span {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.22);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        /* ══ LINKS ══ */
        .links {
            font-size: 0.84rem;
            color: rgba(255, 255, 255, 0.32);
        }

        .links a {
            color: var(--emerald);
            font-weight: 500;
            text-decoration: none;
            transition: color 0.25s ease;
        }

        .links a:hover {
            color: var(--gold);
        }

        /* ══ RESPONSIVE ══ */
        @media (max-width: 480px) {
            .user_card {
                width: 92vw;
                padding: 32px 20px 28px;
            }
        }
    </style>
</head>

<body>

    <!-- HD Bird Backgrounds (same 5 as main page) -->
    <div class="bg-slide">
        <div class="slide active"
            style="background-image:url('https://images.unsplash.com/photo-1444464666168-49d633b86797?w=1920&q=85&auto=format&fit=crop')">
        </div>
        <div class="slide"
            style="background-image:url('https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=1920&q=85&auto=format&fit=crop')">
        </div>
        <div class="slide"
            style="background-image:url('https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=1920&q=85&auto=format&fit=crop')">
        </div>
        <div class="slide"
            style="background-image:url('https://images.unsplash.com/photo-1611689342806-0863700ce1e4?w=1920&q=85&auto=format&fit=crop')">
        </div>
        <div class="slide"
            style="background-image:url('https://images.unsplash.com/photo-1550853024-fae8cd4be47f?w=1920&q=85&auto=format&fit=crop')">
        </div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <div class="slide-dots" id="slideDots">
        <div class="sdot active"></div>
        <div class="sdot"></div>
        <div class="sdot"></div>
        <div class="sdot"></div>
        <div class="sdot"></div>
    </div>

    <!-- Original Bootstrap structure preserved -->
    <div class="container h-100">
        <div class="d-flex justify-content-center h-100">

            <div class="user_card">

                <!-- Brand -->
                <span class="brand-icon">🐦</span>
                <h3 id="form-title">Bird Detection</h3>
                <p class="brand-sub">AI Species Identification</p>
                <div class="brand-line"></div>

                <!-- Form (original structure preserved) -->
                <div class="d-flex justify-content-center form_container">
                    <form method="POST" action="" style="width:100%">
                        {% csrf_token %}

                        <!-- Username (original field names kept) -->
                        <div class="input-group mb-3">
                            <div class="input-group-append">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                            </div>
                            <input type="text" name="username" placeholder="Username…" class="form-control input_user"
                                autocomplete="username">
                        </div>

                        <!-- Password (original field name kept) -->
                        <div class="input-group mb-2">
                            <div class="input-group-append">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                            </div>
                            <div class="pw-wrap">
                                <input type="password" name="password" placeholder="Password…"
                                    class="form-control input_pass" id="pwField" autocomplete="current-password">
                                <button type="button" class="pw-eye" onclick="togglePw()" id="pwToggle">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Remember + Forgot -->
                        <div class="options-row">
                            <label class="remember-label">
                                <input type="checkbox" name="remember">
                                <span class="chk-custom"></span>
                                Remember me
                            </label>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </div>

                        <!-- Submit (original input type preserved) -->
                        <div class="d-flex justify-content-center mt-1 login_container">
                            <input class="btn login_btn" type="submit" value="🚀  Sign In">
                        </div>

                    </form>
                </div>

                <!-- Django messages (original preserved) -->
                {% for message in messages %}
                <p id="messages">{{ message }}</p>
                {% endfor %}

                <!-- Divider -->
                <div class="divider">
                    <div class="divider-line"></div>
                    <span>new here?</span>
                    <div class="divider-line"></div>
                </div>

                <!-- Sign up link (original preserved) -->
                <div class="mt-2">
                    <div class="d-flex justify-content-center links">
                        Don't have an account?
                        <a href="{% url 'register' %}" class="ml-2">Sign Up →</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        /* ── SLIDESHOW ── */
        const slides = document.querySelectorAll('.bg-slide .slide');
        const dots = document.querySelectorAll('#slideDots .sdot');
        let cur = 0;
        setInterval(() => {
            slides[cur].classList.remove('active'); dots[cur].classList.remove('active');
            cur = (cur + 1) % slides.length;
            slides[cur].classList.add('active'); dots[cur].classList.add('active');
        }, 5500);

        /* ── PARTICLES ── */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resize(); window.addEventListener('resize', resize);

        class Particle {
            constructor() { this.reset(true); }
            reset(init = false) {
                this.x = Math.random() * canvas.width;
                this.y = init ? Math.random() * canvas.height : canvas.height + 10;
                this.r = Math.random() * 2.2 + 0.8;
                this.vy = Math.random() * 0.6 + 0.2;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.a = Math.random() * 0.4 + 0.08;
                this.c = Math.random() > 0.5 ? '46,204,143' : '240,192,96';
            }
            step() {
                this.y -= this.vy; this.x += this.vx; this.a -= 0.001;
                if (this.y < -10 || this.a <= 0) this.reset();
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.c},${this.a})`; ctx.fill();
            }
        }

        const pts = Array.from({ length: 65 }, () => new Particle());
        (function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pts.forEach(p => { p.step(); p.draw(); });
            requestAnimationFrame(loop);
        })();

        /* ── PASSWORD TOGGLE ── */
        function togglePw() {
            const inp = document.getElementById('pwField');
            const ico = document.querySelector('#pwToggle i');
            if (inp.type === 'password') {
                inp.type = 'text';
                ico.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                inp.type = 'password';
                ico.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        /* ── CHECKBOX ANIMATION ── */
        document.querySelectorAll('.remember-label input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', function () {
                this.nextElementSibling.style.transform = this.checked ? 'scale(1.15)' : 'scale(1)';
            });
        });
    </script>

</body>

</html>
